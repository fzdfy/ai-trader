# ============================================================
#  AI Trader — 全容器部署
#
#  启动: docker compose up -d
#  停止: docker compose down
#  查看: docker compose logs -f
#  重建: docker compose up -d --build
# ============================================================

# 日志轮转策略（复用配置）
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # ---- 前端 + 反向代理 ----
  nginx:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    container_name: aitrader-nginx
    ports:
      - "8080:80"
    depends_on:
      - server
    restart: unless-stopped
    logging: *logging

  # ---- API 服务 ----
  server:
    build:
      context: .
      dockerfile: docker/server.Dockerfile
    container_name: aitrader-server
    ports:
      - "3001:3001"
    env_file:
      - .env.local
    environment:
      # 容器网络地址覆盖（localhost → 容器名）
      - DATABASE_URL=postgres://ai-trader:aitrader123@postgres:5432/aitrader
      - BETTER_AUTH_URL=http://localhost:8080
      - QUANT_URL=http://quant:3002
      # 日志
      - SERVICE_NAME=server
      - LOG_FORMAT=json
    depends_on:
      - postgres
    restart: unless-stopped
    logging: *logging

  # ---- 数据同步 Worker ----
  worker:
    build:
      context: .
      dockerfile: docker/server.Dockerfile
    container_name: aitrader-worker
    command: pnpm --prefix apps/server worker:sync
    env_file:
      - .env.local
    environment:
      - DATABASE_URL=postgres://ai-trader:aitrader123@postgres:5432/aitrader
      - BETTER_AUTH_URL=http://localhost:8080
      - QUANT_URL=http://quant:3002
      # 日志
      - SERVICE_NAME=worker
      - LOG_FORMAT=json
    depends_on:
      - postgres
    restart: unless-stopped
    logging: *logging

  # ---- 回测微服务 ----
  quant:
    build:
      context: .
      dockerfile: docker/quant.Dockerfile
    container_name: aitrader-quant
    ports:
      - "3002:3002"
    environment:
      - DATABASE_URL=postgres://ai-trader:aitrader123@postgres:5432/aitrader
      # 日志
      - SERVICE_NAME=quant
      - LOG_FORMAT=json
    depends_on:
      - postgres
    restart: unless-stopped
    logging: *logging

  # ---- PostgreSQL + pgvector ----
  postgres:
    build:
      context: .
      dockerfile: docker/postgres.Dockerfile
    container_name: aitrader-postgres
    environment:
      POSTGRES_PASSWORD: aitrader123
      POSTGRES_DB: aitrader
      POSTGRES_USER: ai-trader
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    restart: unless-stopped

volumes:
  pgdata:
