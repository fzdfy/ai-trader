version: '3.8'

services:
  postgres:
    build: .
    container_name: postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: aitrader123
      POSTGRES_DB: aitrader
      POSTGRES_USER: ai-trader
    ports:
      - "5432:5432"
    volumes:
      # 持久化数据卷 — 删除容器或重新构建不丢数据
      - pgdata:/var/lib/postgresql

volumes:
  pgdata:
