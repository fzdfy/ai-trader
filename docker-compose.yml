# ============================================================
#  AI Trader — 全容器部署
#
#  启动: docker compose up -d
#  停止: docker compose down
#  查看: docker compose logs -f
#  重建: docker compose up -d --build
# ============================================================

# 日志轮转策略（复用配置）
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # ---- 前端 + 反向代理 ----
  nginx:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    container_name: aitrader-nginx
    ports:
      - "9080:80"
    depends_on:
      - server
    restart: unless-stopped
    logging: *logging

  # ---- API 服务 ----
  server:
    build:
      context: .
      dockerfile: docker/server.Dockerfile
    container_name: aitrader-server
    ports:
      - "3001:3001"
    env_file:
      - .env.local
    environment:
      # 容器网络地址覆盖（localhost → 容器名）；application_name 用于 postgres 慢查询归属
      - DATABASE_URL=postgres://ai-trader:aitrader123@postgres:5432/aitrader?application_name=server
      - BETTER_AUTH_URL=http://localhost:9080
      - QUANT_URL=http://quant:3002
      # 日志
      - SERVICE_NAME=server
      - LOG_FORMAT=json
      - TZ=Asia/Shanghai
    depends_on:
      - postgres
    restart: unless-stopped
    logging: *logging

  # ---- 数据同步 Worker ----
  worker:
    build:
      context: .
      dockerfile: docker/server.Dockerfile
    container_name: aitrader-worker
    command: pnpm --prefix apps/server worker:sync
    env_file:
      - .env.local
    environment:
      - DATABASE_URL=postgres://ai-trader:aitrader123@postgres:5432/aitrader?application_name=worker
      - BETTER_AUTH_URL=${BETTER_AUTH_URL:-http://localhost:9080}
      - QUANT_URL=http://quant:3002
      # 日志
      - SERVICE_NAME=worker
      - LOG_FORMAT=json
      - TZ=Asia/Shanghai
    depends_on:
      - postgres
    restart: unless-stopped
    logging: *logging

  # ---- 回测微服务 ----
  quant:
    build:
      context: .
      dockerfile: docker/quant.Dockerfile
    container_name: aitrader-quant
    ports:
      - "3002:3002"
    environment:
      - DATABASE_URL=postgres://ai-trader:aitrader123@postgres:5432/aitrader?application_name=quant
      # 日志
      - SERVICE_NAME=quant
      - LOG_FORMAT=json
      - TZ=Asia/Shanghai
    depends_on:
      - postgres
    restart: unless-stopped
    logging: *logging

  # ---- PostgreSQL + pgvector ----
  postgres:
    build:
      context: .
      dockerfile: docker/postgres.Dockerfile
    container_name: aitrader-postgres
    # jsonlog 需开启 logging_collector 且只写文件（不进 stdout），无法被 docker 采集；
    # 因此用默认 stderr 文本 + 前缀携带 app/db，由 Alloy 正则解析
    command:
      - postgres
      - -c
      - log_destination=stderr
      - -c
      - log_min_duration_statement=200
      - -c
      - "log_line_prefix=%m [%p] app=%a db=%d "
    environment:
      POSTGRES_PASSWORD: aitrader123
      POSTGRES_DB: aitrader
      POSTGRES_USER: ai-trader
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    restart: unless-stopped
    logging: *logging

  # ---- 日志存储：Loki（30 天保留） ----
  loki:
    image: grafana/loki:3.3.2
    container_name: aitrader-loki
    command: -config.file=/etc/loki/loki-config.yml
    ports:
      - "3100:3100"
    volumes:
      - ./docker/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki-data:/loki
    restart: unless-stopped
    logging: *logging

  # ---- 日志采集：Grafana Alloy（docker socket + 解析 → Loki） ----
  alloy:
    image: grafana/alloy:v1.5.1
    container_name: aitrader-alloy
    command:
      - run
      - /etc/alloy/config.alloy
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
    ports:
      - "12345:12345"
    volumes:
      - ./docker/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy-data:/var/lib/alloy/data
    depends_on:
      - loki
    restart: unless-stopped
    logging: *logging

  # ---- 日志查询：Grafana（Loki 数据源已自动配置） ----
  grafana:
    image: grafana/grafana:11.4.0
    container_name: aitrader-grafana
    ports:
      - "3010:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - loki
    restart: unless-stopped
    logging: *logging

volumes:
  pgdata:
  loki-data:
  alloy-data:
  grafana-data:
