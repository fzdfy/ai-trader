<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Apollo Current Design Atlas</title>
  <style>
    :root {
      color-scheme: light;
      --canvas: #f4f2ed;
      --canvas-grid: rgba(49, 87, 232, .035);
      --panel: #fff;
      --surface: #f7f8fb;
      --surface-strong: #eef2f8;
      --ink: #202a42;
      --ink-2: #5f6d84;
      --muted: #66738a;
      --line: #dfe3eb;
      --line-strong: #cbd2df;
      --primary: #3157e8;
      --primary-soft: #edf1ff;
      --accent: #ffd951;
      --success: #0b967a;
      --warning: #b87918;
      --shadow: 0 18px 44px rgba(36, 47, 77, .09);
      --font: "SF Pro Text", "PingFang SC", "Microsoft YaHei", sans-serif;
      --mono: "SFMono-Regular", "Roboto Mono", Menlo, monospace;
    }
    html[data-theme="dark"] {
      color-scheme: dark;
      --canvas: #111521;
      --canvas-grid: rgba(91, 121, 255, .05);
      --panel: #171d2a;
      --surface: #1d2534;
      --surface-strong: #273044;
      --ink: #eef2f9;
      --ink-2: #b8c3d5;
      --muted: #9eabbd;
      --line: #2a3447;
      --line-strong: #3b4960;
      --primary: #718cff;
      --primary-soft: rgba(113, 140, 255, .13);
      --accent: #f5d90a;
      --success: #31b99a;
      --warning: #f4c765;
      --shadow: 0 20px 48px rgba(0, 0, 0, .24);
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    html { overflow: clip; }
    body {
      margin: 0;
      overflow: clip;
      color: var(--ink);
      background:
        linear-gradient(var(--canvas-grid) 1px, transparent 1px),
        linear-gradient(90deg, var(--canvas-grid) 1px, transparent 1px),
        var(--canvas);
      background-size: 28px 28px;
      font-family: var(--font);
    }
    button, input, a { font: inherit; }
    button { color: inherit; }
    button, a { -webkit-tap-highlight-color: transparent; }
    button:focus-visible, a:focus-visible, input:focus-visible, iframe:focus-visible {
      outline: 2px solid var(--primary);
      outline-offset: 2px;
    }
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
    .atlas-shell {
      display: grid;
      grid-template-columns: 276px minmax(0, 1fr);
      height: 100%;
    }
    .atlas-sidebar {
      z-index: 30;
      min-width: 0;
      display: flex;
      flex-direction: column;
      background: color-mix(in srgb, var(--panel) 96%, transparent);
      border-right: 1px solid var(--line);
      box-shadow: 12px 0 30px rgba(31, 39, 62, .035);
    }
    .atlas-brand {
      display: flex;
      align-items: center;
      gap: 11px;
      min-height: 72px;
      padding: 15px 18px;
      border-bottom: 1px solid var(--line);
    }
    .atlas-mark {
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      flex: 0 0 auto;
      color: #fff;
      background: var(--primary);
      border-radius: 11px;
      box-shadow: 0 8px 18px color-mix(in srgb, var(--primary) 24%, transparent);
      font: 700 13px/1 var(--mono);
    }
    html[data-theme="dark"] .atlas-mark { color: #111521; }
    .atlas-brand-copy { min-width: 0; }
    .atlas-brand-copy strong {
      display: block;
      font-size: 14px;
      letter-spacing: -.02em;
    }
    .atlas-brand-copy span {
      display: block;
      margin-top: 3px;
      color: var(--muted);
      font: 11px/1.2 var(--mono);
      letter-spacing: .08em;
    }
    .atlas-sidebar-tools {
      padding: 13px 14px 8px;
    }
    .atlas-search {
      display: flex;
      align-items: center;
      gap: 8px;
      height: 38px;
      padding: 0 11px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 10px;
    }
    .atlas-search svg { width: 15px; height: 15px; color: var(--muted); }
    .atlas-search input {
      min-width: 0;
      flex: 1;
      color: var(--ink);
      background: transparent;
      border: 0;
      outline: 0;
      font-size: 12px;
    }
    .atlas-search input::placeholder { color: var(--muted); }
    .atlas-nav {
      min-height: 0;
      flex: 1;
      overflow: auto;
      padding: 4px 10px 20px;
      scrollbar-width: thin;
    }
    .nav-group { margin-top: 14px; }
    .nav-group-title {
      margin: 0 9px 7px;
      color: var(--muted);
      font: 650 11px/1.2 var(--mono);
      letter-spacing: .12em;
      text-transform: uppercase;
    }
    .atlas-nav-button {
      width: 100%;
      display: grid;
      grid-template-columns: 24px minmax(0, 1fr) auto;
      align-items: center;
      gap: 8px;
      padding: 9px 10px;
      color: var(--ink-2);
      background: transparent;
      border: 0;
      border-radius: 9px;
      text-align: left;
      cursor: pointer;
      transition: background .16s ease, color .16s ease, transform .16s ease;
    }
    .atlas-nav-button:hover { color: var(--ink); background: var(--surface); }
    .atlas-nav-button.active {
      color: var(--primary);
      background: var(--primary-soft);
      font-weight: 650;
    }
    .atlas-nav-button.active .atlas-nav-index { color: inherit; font-weight: 700; }
    .atlas-nav-index {
      color: var(--muted);
      font: 11px/1 var(--mono);
      text-align: center;
    }
    .atlas-nav-label {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 12px;
    }
    .atlas-nav-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--success);
    }
    .atlas-nav-dot.pending { background: var(--warning); }
    .atlas-sidebar-foot {
      display: grid;
      gap: 8px;
      padding: 13px 14px 15px;
      border-top: 1px solid var(--line);
    }
    .atlas-sidebar-note {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.55;
    }
    .atlas-sidebar-note i {
      width: 7px;
      height: 7px;
      margin-top: 3px;
      flex: 0 0 auto;
      border-radius: 50%;
      background: var(--success);
      box-shadow: 0 0 0 4px color-mix(in srgb, var(--success) 11%, transparent);
    }
    .atlas-main {
      min-width: 0;
      display: flex;
      flex-direction: column;
    }
    .atlas-topbar {
      min-height: 58px;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 18px;
      background: color-mix(in srgb, var(--panel) 92%, transparent);
      border-bottom: 1px solid var(--line);
      backdrop-filter: blur(14px);
    }
    .atlas-menu-button {
      width: 34px;
      height: 34px;
      display: none;
      place-items: center;
      flex: 0 0 auto;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 9px;
      cursor: pointer;
    }
    .atlas-menu-button svg { width: 16px; height: 16px; }
    .atlas-breadcrumb {
      min-width: 0;
      display: flex;
      align-items: center;
      gap: 7px;
      color: var(--muted);
      font: 11px/1.3 var(--mono);
      white-space: nowrap;
    }
    .atlas-breadcrumb b { color: var(--ink); font-weight: 650; }
    .atlas-top-actions {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 7px;
    }
    .atlas-count {
      display: inline-flex;
      align-items: center;
      height: 30px;
      padding: 0 10px;
      color: var(--ink-2);
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 8px;
      font: 11px/1 var(--mono);
      white-space: nowrap;
    }
    .icon-button, .text-button {
      height: 32px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      color: var(--ink-2);
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 8px;
      cursor: pointer;
      text-decoration: none;
      transition: border-color .16s ease, color .16s ease, background .16s ease;
    }
    .icon-button { width: 34px; padding: 0; }
    .icon-button svg, .text-button svg { width: 14px; height: 14px; }
    .text-button { padding: 0 10px; font-size: 11px; }
    .icon-button:hover, .text-button:hover {
      color: var(--primary);
      background: var(--primary-soft);
      border-color: color-mix(in srgb, var(--primary) 35%, var(--line));
    }
    .atlas-content {
      min-height: 0;
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 14px 18px 18px;
    }
    .page-heading {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 14px;
      margin-bottom: 11px;
    }
    .page-heading-main { min-width: 0; }
    .page-kicker {
      color: var(--primary);
      font: 650 11px/1.2 var(--mono);
      letter-spacing: .13em;
    }
    .page-heading h1 {
      margin: 5px 0 0;
      font-size: clamp(20px, 2.5vw, 30px);
      line-height: 1.05;
      letter-spacing: -.045em;
    }
    .page-description {
      max-width: 760px;
      margin: 7px 0 0;
      color: var(--ink-2);
      font-size: 11px;
      line-height: 1.55;
    }
    .page-badges {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 6px;
    }
    .status-chip {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      height: 24px;
      padding: 0 8px;
      color: var(--ink-2);
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 999px;
      font: 11px/1 var(--mono);
      white-space: nowrap;
    }
    .status-chip i {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--success);
    }
    .status-chip.pending i { background: var(--warning); }
    .status-chip.dark { background: var(--ink); color: var(--panel); border-color: var(--ink); }
    .atlas-preview {
      min-height: 0;
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 16px;
      box-shadow: var(--shadow);
    }
    .preview-toolbar {
      min-height: 45px;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 10px;
      background: color-mix(in srgb, var(--panel) 96%, var(--surface));
      border-bottom: 1px solid var(--line);
    }
    .tab-list, .viewport-switch {
      display: inline-flex;
      align-items: center;
      padding: 3px;
      background: var(--surface);
      border-radius: 8px;
    }
    .tab-button, .viewport-button {
      height: 27px;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 0 9px;
      color: var(--muted);
      background: transparent;
      border: 0;
      border-radius: 6px;
      cursor: pointer;
      font-size: 11px;
    }
    .tab-button[aria-selected="true"], .viewport-button[aria-pressed="true"] {
      color: var(--ink);
      background: var(--panel);
      box-shadow: 0 1px 4px rgba(28, 38, 61, .08);
      font-weight: 650;
    }
    .preview-toolbar-spacer { flex: 1; }
    .source-label {
      max-width: 230px;
      overflow: hidden;
      color: var(--muted);
      font: 11px/1 var(--mono);
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .preview-body {
      min-height: 0;
      flex: 1;
      position: relative;
      overflow: auto;
      background: var(--surface);
    }
    .preview-live {
      min-height: 100%;
      display: grid;
      place-items: center;
      padding: 10px;
    }
    .preview-live.mobile {
      align-items: start;
      padding: 18px;
    }
    #previewFrame {
      width: 100%;
      height: 100%;
      min-height: 530px;
      display: block;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 10px;
      box-shadow: 0 8px 20px rgba(31, 39, 62, .06);
    }
    .preview-live.mobile #previewFrame {
      width: min(390px, 100%);
      height: 700px;
      min-height: 700px;
      border-radius: 20px;
    }
    .preview-evidence {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 12px;
      padding: 14px;
    }
    .evidence-card {
      overflow: hidden;
      color: inherit;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 11px;
      text-decoration: none;
      transition: transform .16s ease, border-color .16s ease, box-shadow .16s ease;
    }
    .evidence-card:hover {
      transform: translateY(-2px);
      border-color: color-mix(in srgb, var(--primary) 38%, var(--line));
      box-shadow: 0 10px 22px rgba(31, 39, 62, .09);
    }
    .evidence-card img {
      width: 100%;
      aspect-ratio: 16 / 10;
      display: block;
      object-fit: cover;
      object-position: top center;
      background: var(--surface);
      border-bottom: 1px solid var(--line);
    }
    .evidence-copy {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
      padding: 10px 11px;
    }
    .evidence-copy strong { display: block; font-size: 11px; }
    .evidence-copy span { display: block; margin-top: 3px; color: var(--muted); font-size: 11px; }
    .evidence-arrow { color: var(--primary); font: 14px/1 var(--mono); }
    .empty-state {
      min-height: 100%;
      display: grid;
      place-items: center;
      padding: 30px;
      text-align: center;
    }
    .empty-state strong { display: block; font-size: 14px; }
    .empty-state p { max-width: 420px; margin: 7px auto 0; color: var(--muted); font-size: 11px; line-height: 1.6; }
    .sidebar-scrim {
      position: fixed;
      inset: 0;
      z-index: 25;
      display: none;
      background: rgba(16, 22, 35, .35);
      backdrop-filter: blur(3px);
    }
    [hidden] { display: none !important; }
    @media (max-width: 900px) {
      .atlas-shell { grid-template-columns: 1fr; }
      .atlas-sidebar {
        position: fixed;
        inset: 0 auto 0 0;
        width: min(292px, calc(100vw - 42px));
        transform: translateX(-105%);
        transition: transform .2s ease;
      }
      .atlas-sidebar.open { transform: none; }
      .sidebar-scrim { display: block; }
      .atlas-menu-button { display: grid; }
      .atlas-content { padding: 11px 12px 12px; }
      .atlas-topbar { padding: 0 12px; }
      .atlas-count, .source-label { display: none; }
      .atlas-search input { font-size: 16px; }
      .page-heading { align-items: flex-start; flex-direction: column; }
      .page-badges { justify-content: flex-start; }
      .preview-toolbar { flex-wrap: wrap; }
      #previewFrame { min-height: 470px; }
    }
    @media (max-width: 560px) {
      .atlas-top-actions .text-button span { display: none; }
      .atlas-breadcrumb span:first-child { display: none; }
      .page-description { font-size: 11px; }
      .tab-button, .viewport-button { padding: 0 7px; }
      .preview-live { padding: 6px; }
      .preview-live.mobile { padding: 10px; }
      .preview-evidence { grid-template-columns: 1fr; padding: 10px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        transition-duration: .01ms !important;
        animation-duration: .01ms !important;
      }
    }
  </style>
</head>
<body>
  <div class="atlas-shell">
    <aside class="atlas-sidebar" id="atlasSidebar" aria-label="设计总稿导航">
      <div class="atlas-brand">
        <span class="atlas-mark">AQ</span>
        <span class="atlas-brand-copy">
          <strong>Apollo Current Design Atlas</strong>
          <span>CURRENT · 2026-11-27</span>
        </span>
      </div>
      <div class="atlas-sidebar-tools">
        <label class="atlas-search">
          <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m15.5 15.5 4 4"/></svg>
          <span class="sr-only">搜索设计页面</span>
          <input id="atlasSearch" type="search" placeholder="搜索页面、状态或分组">
        </label>
      </div>
      <nav class="atlas-nav" id="atlasNav" aria-label="当前设计页面"></nav>
      <div class="atlas-sidebar-foot">
        <div class="atlas-sidebar-note"><i></i><span>单一当前入口。历史确认稿与局部探索稿继续保留，用于追溯。</span></div>
      </div>
    </aside>
    <div class="sidebar-scrim" id="sidebarScrim" hidden></div>
    <main class="atlas-main">
      <header class="atlas-topbar">
        <button class="atlas-menu-button" id="menuButton" type="button" aria-label="打开设计导航" aria-controls="atlasSidebar" aria-expanded="false">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
        </button>
        <div class="atlas-breadcrumb">
          <span>DESIGN ATLAS</span><span>/</span><b id="breadcrumbGroup">工作空间</b><span>/</span><strong id="breadcrumbPage">每日看板</strong>
        </div>
        <div class="atlas-top-actions">
          <span class="atlas-count" id="atlasCount"></span>
          <button class="icon-button" id="themeButton" type="button" aria-label="切换深色模式" title="切换深浅色">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          </button>
          <a class="text-button" id="standaloneLink" href="#" target="_blank" rel="noreferrer">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M14 4h6v6M20 4l-9 9"/><path d="M11 5H5a1 1 0 0 0-1 1v13a1 1 0 0 0 1 1h13a1 1 0 0 0 1-1v-6"/></svg>
            <span>独立打开</span>
          </a>
        </div>
      </header>
      <section class="atlas-content">
        <div class="page-heading">
          <div class="page-heading-main">
            <div class="page-kicker" id="pageKicker">WORKSPACE · PAGE 01</div>
            <h1 id="pageTitle">每日看板</h1>
            <p class="page-description" id="pageDescription"></p>
          </div>
          <div class="page-badges" id="pageBadges"></div>
        </div>
        <section class="atlas-preview" aria-label="设计预览">
          <div class="preview-toolbar">
            <div class="tab-list" role="tablist" aria-label="预览模式">
              <button class="tab-button" id="liveTab" type="button" role="tab" aria-selected="true" aria-controls="livePanel">实时原型</button>
              <button class="tab-button" id="evidenceTab" type="button" role="tab" aria-selected="false" aria-controls="evidencePanel">状态证据</button>
            </div>
            <div class="viewport-switch" role="group" aria-label="预览宽度">
              <button class="viewport-button" data-viewport="desktop" type="button" aria-pressed="true">桌面</button>
              <button class="viewport-button" data-viewport="mobile" type="button" aria-pressed="false">移动端</button>
            </div>
            <span class="preview-toolbar-spacer"></span>
            <span class="source-label" id="sourceLabel"></span>
          </div>
          <div class="preview-body">
            <div class="preview-live" id="livePanel" role="tabpanel">
              <iframe id="previewFrame" title="当前设计页面预览" loading="eager"></iframe>
            </div>
            <div class="preview-evidence" id="evidencePanel" role="tabpanel" hidden></div>
          </div>
        </section>
      </section>
    </main>
  </div>
  <script>
    const PAGES = [
      { id:"dashboard", group:"工作空间", title:"每日看板", status:"已确认落地", source:"../explorations/quant-workbench-dashboard-market-radar-v6.html", supportsDark:true, description:"A 股主控台、跨市场背景、主流 ETF、市场 SIGNAL 与今日执行区。来源变更：refine-dashboard-market-radar-visual-fidelity。", evidence:[
        ["浅色桌面","../explorations/screenshots/dashboard-market-radar-v6/visual-fidelity/desktop-light.png","1440×900 · 真实数据"],
        ["深色桌面","../explorations/screenshots/dashboard-market-radar-v6/visual-fidelity/desktop-dark.png","深色主题"],
        ["移动端","../explorations/screenshots/dashboard-market-radar-v6/visual-fidelity/mobile-light.png","390×844 · 单列"],
        ["今日执行","../explorations/screenshots/dashboard-market-radar-v6/visual-fidelity/desktop-today-light.png","今日行动与今日工作流"]
      ]},
      { id:"tasks", group:"工作空间", title:"工作任务", status:"确认基准", source:"../initial/quant-workbench-user-work-task-v1.html", search:"page=daily&view=today", supportsDark:true, description:"今日三列看板、任务状态、拖拽排序和详情编辑的统一视觉基准。", evidence:[

        }).join("")}</section>`;
      }).join("") || `<div class="empty-state"><div><strong>没有匹配页面</strong><p>尝试清空搜索或换一个关键词。</p></div></div>`;
      $$(".atlas-nav-button").forEach(button => button.addEventListener("click", () => {
        location.search = `?page=${encodeURIComponent(button.dataset.pageId)}`;
      }));
    }
    function buildSource(page) {
      const url = new URL(page.source, location.href);
      if (page.search) new URLSearchParams(page.search).forEach((value, key) => url.searchParams.set(key, value));
      if (state.theme === "dark" && page.supportsDark) url.searchParams.set("theme", "dark");
      else url.searchParams.delete("theme");
      if (page.hash) url.hash = page.hash;
      return url.href;
    }
    function applyInteraction(page) {
      if (!page.interaction) return;
      try {
        const doc = frame.contentDocument;
        if (!doc) return;
        if (page.interaction === "assistant-full") {
          setTimeout(() => doc.getElementById("expandAssistant")?.click(), 250);
        }
        if (page.interaction === "task-detail") {
          setTimeout(() => doc.querySelector("[data-task-id], .task-item")?.click(), 250);
        }
      } catch {}
    }
    function syncFrameTheme(page) {
      try {
        const doc = frame.contentDocument;
        if (!doc) return;
        const dark = state.theme === "dark" && page.supportsDark;
        doc.documentElement.classList.toggle("dark", dark);
        doc.documentElement.style.colorScheme = dark ? "dark" : "light";
      } catch {}
    }
    function renderEvidence(page) {
      const panel = $("#evidencePanel");
      const evidence = page.evidence || [];
      panel.innerHTML = evidence.length ? evidence.map(([title, src, note]) => `
        <a class="evidence-card" href="${escapeHtml(src)}" target="_blank" rel="noreferrer">
          <img src="${escapeHtml(src)}" alt="${escapeHtml(title)}" loading="lazy">
          <span class="evidence-copy"><span><strong>${escapeHtml(title)}</strong><span>${escapeHtml(note)}</span></span><span class="evidence-arrow">↗</span></span>
        </a>`).join("") : `<div class="empty-state"><div><strong>暂无可视证据</strong><p>当前条目只有可运行原型，尚未沉淀独立截图。页面仍可在“实时原型”中检查。</p></div></div>`;
    }
    function setTab(tab) {
      state.tab = tab;
      const live = tab === "live";
      $("#liveTab").setAttribute("aria-selected", String(live));
      $("#evidenceTab").setAttribute("aria-selected", String(!live));
      $("#livePanel").hidden = !live;
      $("#evidencePanel").hidden = live;
    }
    function setViewport(viewport) {
      state.viewport = viewport;
      $("#livePanel").classList.toggle("mobile", viewport === "mobile");
      $$(".viewport-button").forEach(button => button.setAttribute("aria-pressed", String(button.dataset.viewport === viewport)));
    }
    function selectPage(page) {
      state.activeId = page.id;
      state.tab = page.defaultTab || "live";
      $("#pageKicker").textContent = `${page.group.toUpperCase()} · PAGE ${String(pageIndex(page)).padStart(2, "0")}`;
      $("#pageTitle").textContent = page.title;
      $("#pageDescription").textContent = page.description;
      $("#breadcrumbGroup").textContent = page.group;
      $("#breadcrumbPage").textContent = page.title;
      $("#pageBadges").innerHTML = `
        <span class="status-chip ${statusClass(page)}"><i></i>${escapeHtml(page.status)}</span>
        <span class="status-chip">${page.supportsDark ? "支持深色" : "源稿仅浅色"}</span>
        <span class="status-chip">${page.evidence?.length ? `${page.evidence.length} 份证据` : "实时原型"}</span>`;
      $("#sourceLabel").textContent = page.source.replace("../", "");
      $("#standaloneLink").href = buildSource(page);
      frame.src = buildSource(page);
      frame.onload = () => {
        syncFrameTheme(page);
        applyInteraction(page);
      };
      renderEvidence(page);
      setTab(state.tab);
      renderNav();
      document.title = `${page.title} · Apollo Current Design Atlas`;
      closeSidebar();
      window.scrollTo({ top: 0, left: 0 });
    }
    function init() {
      state.theme = state.theme === "dark" ? "dark" : "light";
      state.viewport = matchMedia("(max-width: 900px)").matches ? "mobile" : "desktop";
      applyTheme();
      $("#atlasCount").textContent = `${PAGES.length} SCREENS · ${groups.length} GROUPS`;
      const requested = new URLSearchParams(location.search).get("page");
      selectPage(pageById(requested || "dashboard"));
      setViewport(state.viewport);
      $("#atlasSearch").addEventListener("input", event => {
        state.query = event.target.value;
        renderNav();
      });
      $("#themeButton").addEventListener("click", () => {
        state.theme = state.theme === "dark" ? "light" : "dark";
        applyTheme();
        $("#standaloneLink").href = buildSource(pageById(state.activeId));
      });
      $("#liveTab").addEventListener("click", () => setTab("live"));
      $("#evidenceTab").addEventListener("click", () => setTab("evidence"));
      $$(".viewport-button").forEach(button => button.addEventListener("click", () => setViewport(button.dataset.viewport)));
      iconMenu.addEventListener("click", () => sidebar.classList.contains("open") ? closeSidebar() : openSidebar());
      scrim.addEventListener("click", closeSidebar);
      document.addEventListener("keydown", event => {
        if (event.key === "Escape") closeSidebar();
      });
    }
    init();
  </script>
</body>
</html>
