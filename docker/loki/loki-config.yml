# ============================================================
#  Loki 3.x — 单机（filesystem + TSDB）配置
#
#  · 保留周期 720h = 30 天（compactor 负责真正删除）
#  · allow_structured_metadata: 高基数字段（request_id / job_run_id / route …）
#    走 structured metadata，不建索引，避免 label 爆炸
#  · schema v13 + tsdb：Loki 3.x 推荐组合
# ============================================================

auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: warn

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-04-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

# 存储与写入限制
limits_config:
  # 开启 structured metadata（Loki 3.x）
  allow_structured_metadata: true
  # 日志保留 30 天
  retention_period: 720h
  # 单用户写入速率（本地单机够用）
  ingestion_rate_mb: 16
  ingestion_burst_size_mb: 32
  # 单条日志最大字节
  max_line_size: 256KB
  # 允许乱序写入（容器启动顺序不定）
  unordered_writes: true
  volume_enabled: true

# 保留策略执行者
compactor:
  working_directory: /loki/compactor
  compaction_interval: 10m
  retention_enabled: true
  retention_delete_delay: 2h
  retention_delete_worker_count: 150
  delete_request_store: filesystem

ruler:
  storage:
    type: local
    local:
      directory: /loki/rules

analytics:
  reporting_enabled: false
