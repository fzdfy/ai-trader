# ============================================================
#  Nginx — 前端静态文件 + /api 反向代理
# ============================================================

# 统一 JSON 访问日志（供 Grafana Alloy 解析后写入 Loki）
# 说明：本文件位于 conf.d/，被主配置 include 在 http{} 内，
#       故 log_format / access_log 写在此处即 http 上下文。
# $request_id 由 nginx 生成并透传给上游（X-Request-Id），
# 保证「nginx 访问日志 ↔ server 业务日志」可用同一 request_id 关联。
# level 按 HTTP 状态码映射，使 4xx/5xx 能被「错误日志速率」面板统计到。
map $status $log_level {
    ~^5  "error";
    ~^4  "warn";
    default "info";
}

log_format json_combined escape=json
  '{'
    '"ts":"$time_iso8601",'
    '"event":"http_access",'
    '"service":"nginx",'
    '"source":"external",'
    '"level":"$log_level",'
    '"remote_addr":"$remote_addr",'
    '"request_id":"$request_id",'
    '"method":"$request_method",'
    '"request_uri":"$request_uri",'
    '"route":"$uri",'
    '"status":$status,'
    '"bytes":$body_bytes_sent,'
    '"duration_ms":$request_time,'
    '"upstream_time":"$upstream_response_time",'
    '"referer":"$http_referer",'
    '"user_agent":"$http_user_agent"'
  '}';

access_log /dev/stdout json_combined;

server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip 压缩
    gzip on;
    gzip_types text/html text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    # API 反向代理 → server 容器
    location /api/ {
        proxy_pass http://server:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;

        # SSE 流式响应支持（AI Chat streaming）
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 120s;
    }

    # Health check 也代理给 server
    location /health {
        set $server_upstream http://server:3001;
        proxy_pass $server_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Request-Id $request_id;
    }

    # index.html 不缓存：每次验证，确保拿到最新的资源 hash 引用
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri /index.html;
    }

    # 带 content hash 的静态资源（JS/CSS/图片等）长期强缓存，文件名变则 hash 变
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA fallback：所有非 API 请求回退到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
