<!doctype html>
<html lang="zh-CN" data-preline-theme="theme-blue">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Apollo Quant - 智能股票分析</title>
    <link rel="icon" type="image/svg+xml" href="/apollo-logo.svg?v=2" />
    <link rel="icon" href="/favicon.ico?v=2" sizes="16x16 32x32 48x48" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2" />
    <meta name="theme-color" content="#3157E8" />
    <script>
      (() => {
        const saved = localStorage.getItem("apollo.theme.mode") || "system";
        const dark =
          saved === "dark" ||
          (saved !== "light" &&
            window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.classList.toggle("dark", dark);
        document.documentElement.style.colorScheme = dark ? "dark" : "light";
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
